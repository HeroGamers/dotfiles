name: CI

on:
  pull_request:
  push:
    branches:
      - nix

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31

      - name: Run repository checks
        run: |
          nix build --accept-flake-config --no-link --no-update-lock-file \
            .#checks.x86_64-linux.pre-commit \
            .#checks.x86_64-linux.treefmt
